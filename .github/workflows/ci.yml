name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The version and components are rust-toolchain.toml's; this installs them.
      - name: Rust, from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: cargo build --release
        run: cargo build --release

      # Every step below runs even when one before it failed, so one run shows all of them.
      # What a contributor types: the `kibbr` package alone, no feature named.
      - name: cargo test
        if: ${{ !cancelled() }}
        run: cargo test --no-fail-fast

      # Every package and every feature: the bench's tests, and with `fuzzing` the replay of
      # the saved fuzz inputs, which without it is silently not run.
      - name: cargo test --workspace --all-features
        if: ${{ !cancelled() }}
        run: cargo test --workspace --all-features --no-fail-fast

      # Three builds are linted. Everything, with every feature; the package's tests as
      # `cargo test` builds them; and the build that ships, which has no test hooks in it.
      - name: cargo clippy, everything
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo clippy, the package and its tests
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo clippy, the build that ships
        if: ${{ !cancelled() }}
        run: cargo clippy -- -D warnings

      # What a release would upload, built from the package alone. Uploads nothing.
      - name: cargo publish --dry-run
        if: ${{ !cancelled() }}
        run: cargo publish --dry-run --locked

      # The fuzz targets are a workspace of their own and run on nightly; this only makes
      # sure that they still build against the library.
      - name: cargo check, the fuzz targets
        if: ${{ !cancelled() }}
        run: cargo check --manifest-path fuzz/Cargo.toml

      - name: scripts/check/agree.sh
        if: ${{ !cancelled() }}
        run: scripts/check/agree.sh

      - name: scripts/fault/crash_test.sh, 3 rounds
        if: ${{ !cancelled() }}
        run: ROUNDS=3 scripts/fault/crash_test.sh

  # The web console is committed built (src/server/viewer.html), because the
  # Rust build has no Node. This builds web/ again and fails when the two differ.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Node, from web/.nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: npm run build
        working-directory: web
        run: npm run build

      - name: viewer.html is what web/ builds
        run: |
          git diff --stat --exit-code -- src/server/viewer.html || {
            echo "::error file=src/server/viewer.html::out of date with web/: run npm run build in web/ and commit the result"
            exit 1
          }
