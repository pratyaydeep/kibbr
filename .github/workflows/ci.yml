name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The version and components are rust-toolchain.toml's; this installs them.
      - name: Rust, from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: cargo build --release
        run: cargo build --release

      # Every step below runs even when one before it failed, so one run shows all of them.
      - name: cargo test --workspace
        if: ${{ !cancelled() }}
        run: cargo test --workspace --no-fail-fast

      - name: cargo clippy -D warnings
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: SPDX headers
        if: ${{ !cancelled() }}
        run: scripts/check/spdx.sh

      - name: scripts/check/agree.sh
        if: ${{ !cancelled() }}
        run: scripts/check/agree.sh

      - name: scripts/fault/crash_test.sh, 3 rounds
        if: ${{ !cancelled() }}
        run: ROUNDS=3 scripts/fault/crash_test.sh

  # The web console is committed built (crates/kibbr-server/src/viewer.html), because the
  # Rust build has no Node. This builds web/ again and fails when the two differ.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Node, from web/.nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: npm run build
        working-directory: web
        run: npm run build

      - name: viewer.html is what web/ builds
        run: |
          git diff --stat --exit-code -- crates/kibbr-server/src/viewer.html || {
            echo "::error file=crates/kibbr-server/src/viewer.html::out of date with web/: run npm run build in web/ and commit the result"
            exit 1
          }
