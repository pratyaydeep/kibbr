# The identity the pod runs as, and the IAM role it may assume through IRSA: EKS puts a
# web identity token in the pod, and the AWS SDK trades it for the role's credentials.
#
# Nothing in this build of kibbr calls S3. The role is the design's - the cold tier's,
# which is not built - and is here so that the day it is, the pod already has it.
# deploy/iam/ holds the role's two documents.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kibbr
  namespace: kibbr
  labels:
    app.kubernetes.io/name: kibbr
  annotations:
    # REPLACE: the account id, and the role's name if it is not `kibbr`.
    eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/kibbr
    # The regional STS endpoint, not the global one in us-east-1.
    eks.amazonaws.com/sts-regional-endpoints: "true"
# Mounted where a container asks for it and nowhere else: kibbr never calls the
# Kubernetes API. (The IRSA token is a projected volume of its own and is not this one.)
automountServiceAccountToken: false
