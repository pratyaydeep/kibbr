# Pinned, because a comparison against "latest" is a comparison against nothing. The
# versions here are also written into results.csv by 07_vs_others.sh, so RESULTS.md says
# what it measured.
#
# Elasticsearch stays on the 8.x line: kibbr's planned ES-compatible API (not built yet)
# targets enough of ES 8.11 for Kibana Discover to work, so 8.x is the line that
# compatibility surface is aimed at.
# 8.19.20 is the current 8.x maintenance release; 9.5.2 is the current major and would be
# a different question.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.20
    container_name: lab_es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      # 1g, not a default: this machine gives the Docker VM 3.84 GB total and
      # 07 brings one system up at a time. Recorded in results.csv, because a
      # heap size is exactly the kind of thing a "default settings" label hides.
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "9201:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60

  # 26.8.7.19 is the current stable patch of the 26.8 line, taken from Docker Hub's tag
  # list. There is no `-lts` tag published for it - that suffix belongs to older lines.
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.7.19
    container_name: lab_ch
    environment:
      # ClickHouse 26.x refuses the default user with no password - the HTTP interface
      # answers 401. Credentials are set explicitly rather than using
      # CLICKHOUSE_SKIP_USER_SETUP, so what the lab connects as is written down.
      - CLICKHOUSE_USER=lab
      - CLICKHOUSE_PASSWORD=lab
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ports:
      - "8124:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60

  clps:
    build:
      context: .
      dockerfile: Dockerfile.clps
    image: lab_clps:v0.13.0
    container_name: lab_clps
    command: ["sleep", "infinity"]
