[workspace]
# One published package, `kibbr`, at the root: its library is the engine (src/engine/), and
# its binary is the server and the command line (src/main.rs). One more that is never
# published, kibbr-devtools, holds the bench (`kibbr-bench`).
# fuzz/ is a workspace of its own, so `cargo build` here never builds a fuzzer.
members = ["crates/kibbr-devtools"]
# Plain `cargo build` and `cargo test` are the `kibbr` package's, and never build the bench.
default-members = ["."]
exclude = ["fuzz", "lab-rs"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Pratyaydeep Ghanta <pratyaydeepghanta@gmail.com>"]
repository = "https://github.com/pratyaydeep/kibbr"
homepage = "https://pratyaydeep.github.io/kibbr/"
rust-version = "1.96.1"
keywords = ["logs", "logging", "database", "columnar", "observability"]

# One version of each dependency for the whole workspace, and one place that says why it
# is here; a package takes what it calls with `workspace = true`.
[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
# CRC-32C for every frame, chunk and log record, on the CPU's CRC instruction where there is one.
crc32c = "0.6.8"
# Default features, so the inflater is pure-Rust `miniz_oxide`: no C where hostile input is decoded.
flate2 = "1.1"
# The global allocator - why is at `#[global_allocator]` in src/main.rs.
mimalloc = "0.1.52"
# `statvfs` before a compaction writes, and a child's CPU time for `kibbr-bench`: std has neither.
libc = "0.2"
# `Frame` and `SizeHint`, for the body the server wraps a request's in to know it was read whole.
http-body = "1"
# A scope on one small pool the disk store owns, for a query's scan threads - never the global pool.
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
# The settings file, `--config` (src/cli/config.rs): the parser and serde only, nothing writes TOML.
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }
# The process's own log, written by one subscriber (src/cli/logging.rs); no attribute macro, so no syn.
tracing = { version = "0.1", default-features = false, features = ["std"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-util = "0.7.19"
# For the bulk door's zstd inputs, `bench-storage` and compressed chunks; C, as high levels need.
# zstdmt builds libzstd's worker threads in, for `bench-storage --zstd-threads`; no kibbr chunk
# encoder uses them.
zstd = { version = "0.13", default-features = false, features = ["zstdmt"] }

[package]
name = "kibbr"
description = "A database for structured JSON logs: each line's shape stored once in a trie, its values as typed columns, a fraction of the raw size and still queryable."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kibbr"
rust-version.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["database-implementations", "command-line-utilities"]
# By name and by kind, not all of src/: with an `include` list Cargo does not read
# .gitignore, and "/src/" would package a file git ignores, such as a .DS_Store.
include = ["/src/**/*.rs", "/src/server/viewer.html", "/Cargo.toml", "/Cargo.lock",
           "/README.md", "/CHANGELOG.md",
           "/LICENSE", "/LICENSE-CONTRIBUTOR", "/NOTICE", "/COMMERCIAL.md",
           "/TRADEMARK.md", "/kibbr.toml.example"]

# The library is the engine: the database, with no HTTP, no flags and no async runtime.
[lib]
path = "src/engine/lib.rs"

# The binary is the server and the command line, over the library.
[[bin]]
name = "kibbr"
path = "src/main.rs"

# One list for the library and the binary. Which of these each layer may name is held by
# a test, not by this file.
[dependencies]
axum.workspace = true
chrono.workspace = true
clap.workspace = true
crc32c.workspace = true
flate2.workspace = true
http-body.workspace = true
libc.workspace = true
mimalloc.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
zstd.workspace = true

# Both are for code that is not shipped. Never switch either on in a build that is run in
# production.
[features]
# What a test of the binary builds its rows and files from, and reaches into a database
# with: a `#[cfg(test)]` item of the library is not there for the binary's tests. It only
# adds items.
test-support = []
# The fuzz targets' harnesses, for fuzz/ and for the replay in src/engine/tests/fuzzing.rs;
# off by default, so a build carries none of them.
fuzzing = []

# A module that has files of its own is `x.rs` beside the folder `x/`, never `x/mod.rs`:
# every file's name then says what it is.
[lints.clippy]
mod_module_files = "deny"

[dev-dependencies]
# The package on itself: turns the test hooks on for tests, and only for tests.
# Not `fuzzing`: the replay runs with `--all-features`.
kibbr = { path = ".", features = ["test-support"] }
# The `/ingest` tests build their own gzip bodies, the bomb included, not the machine's `gzip(1)`.
flate2.workspace = true
