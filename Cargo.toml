[package]
name = "kibbr"
version = "0.1.0"
edition = "2021"
description = "kibbr - log store"
repository = "https://github.com/pratyaydeep/kibbr"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
# CRC-32C for every frame, chunk and log record. Takes the CPU's CRC instruction (SSE 4.2,
# ARMv8) where there is one, which a hand-written table does not.
crc32c = "0.6.8"
# Default features, so the inflater is `miniz_oxide` - pure Rust, no C toolchain in the
# build and nothing new to audit for memory safety on a path that decodes hostile input.
flate2 = "1.1"
# The global allocator, in place of the system's - why is at `#[global_allocator]` in
# src/main.rs. C under the hood, like zstd.
mimalloc = "0.1.52"
# Two things std has no call for. `statvfs`: compaction writes a day a second time beside
# the files it reads, and asks how much room the volume has before it writes a byte. And a
# child process's CPU time, with this process's own to check it against: `kibbr bench`
# divides the rows a server scanned by the CPU-seconds it used, and that server is a child
# (`proc_pid_rusage` and the Mach timebase on macOS, `sysconf` for `/proc`'s tick on Linux,
# `getrusage`). Already in the build under tokio and mimalloc; named here because src/
# calls it.
libc = "0.2"
# `Frame` and `SizeHint`, the two types the `Body` trait's methods are written in: the
# server puts a body of its own around each request's, to know whether it was read to its
# end, and axum hands on the trait without them. Already in the build under axum and
# hyper; named here because src/ now implements the trait.
http-body = "1"
# The threads a query chooses a day's rows on beside its own: one small pool, owned by
# the disk store of a server and started by the first query that has a use for it
# (src/store/fan.rs, the only file that names this crate). A scope on that pool and
# nothing else of rayon's - not its global pool, which is made on first use and shared
# with whatever calls it next, and not `par_iter`, whose caller sleeps while the pool
# works: here the thread that asked takes row groups too, so a pool that is given no
# core costs a query a wait and not its answer. Entered only from a thread that may
# block: a query is on a `spawn_blocking` thread before it reaches the store.
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-util = "0.7.19"
# zstd, for the bulk door's zstd inputs and `bench-storage`'s zstd -19, and for the
# compressed chunks and finished files to come, whose levels 3 and 9 only libzstd has - a
# pure-Rust encoder stops short of them. C under the hood, unlike flate2's inflater: the
# difference is what it reads. `/ingest` decodes bodies from the network and stays gzip on
# miniz_oxide; this decodes an operator's own files, and the format's own bytes.
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
# The `/ingest` tests build the gzip bodies they post, including the bomb. Shelling out to
# `gzip(1)` would make the corpus depend on whichever one is on the machine.
flate2 = "1.1"
