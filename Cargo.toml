[package]
name = "kibbr"
description = "A database for structured JSON logs: each line's shape stored once in a trie, its values as typed columns, a fraction of the raw size and still queryable."
version = "0.4.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Pratyaydeep Ghanta <pratyaydeepghanta@gmail.com>"]
repository = "https://github.com/pratyaydeep/kibbr"
homepage = "https://pratyaydeep.github.io/kibbr/"
documentation = "https://docs.rs/kibbr"
rust-version = "1.96.1"
readme = "README.md"
keywords = ["logs", "logging", "database", "columnar", "observability"]
categories = ["database-implementations", "command-line-utilities"]
exclude = ["/testdata/", "/bench/", "/deploy/", "/docs/", "/scripts/", "/fuzz/", "/.github/", "/lab/", "/lab-rs/", "/web/"]

# One crate: the engine (src/engine/), the HTTP server over it (src/server/) and the
# command line over both (src/cli/). fuzz/ is a package of its own, so `cargo build` here
# never builds a fuzzer.

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
# CRC-32C for every frame, chunk and log record, on the CPU's CRC instruction where there is one.
crc32c = "0.6.8"
# Default features, so the inflater is pure-Rust `miniz_oxide`: no C where hostile input is decoded.
flate2 = "1.1"
# The global allocator - why is at `#[global_allocator]` in src/main.rs.
mimalloc = "0.1.52"
# `statvfs` before a compaction writes, and a child's CPU time for `kibbr bench`: std has neither.
libc = "0.2"
# `Frame` and `SizeHint`, for the body the server wraps a request's in to know it was read whole.
http-body = "1"
# A scope on one small pool the disk store owns, for a query's scan threads - never the global pool.
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
# The settings file, `--config` (src/config.rs): the parser and serde only, nothing writes TOML.
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }
# The process's own log, written by one subscriber (src/logs.rs); no attribute macro, so no syn.
tracing = { version = "0.1", default-features = false, features = ["std"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-util = "0.7.19"
# For the bulk door's zstd inputs, `bench-storage` and compressed chunks; C, as high levels need.
# zstdmt builds libzstd's worker threads in, for `bench-storage --zstd-threads`; no kibbr chunk
# encoder uses them.
zstd = { version = "0.13", default-features = false, features = ["zstdmt"] }

[features]
# The fuzz targets' harnesses, for fuzz/; off by default, so the binary carries none of
# them. A plain `cargo test` builds them anyway and replays fuzz/regressions/.
fuzzing = []
# `kibbr bench`, the end-to-end speed measurement. Off by default: it is a quarter of the
# source, and leaving it out keeps the build that is edited and tested fast.
bench = []

[profile.dev]
# Line tables only: backtraces keep their file and line, and the target directory and a
# clean build both shrink by a third.
debug = "line-tables-only"

[package.metadata.docs.rs]
# The crate's surface is the binary; its documentation is the private modules.
rustdoc-args = ["--document-private-items"]
