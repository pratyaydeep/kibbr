[workspace]
# Five crates, each allowed to name only the ones under it: kibbr -> kibbr-server ->
# kibbr-engine -> kibbr-storage -> kibbr-core.
# fuzz/ is a workspace of its own, so `cargo build` here never builds a fuzzer.
members = ["crates/kibbr-core", "crates/kibbr-storage", "crates/kibbr-engine", "crates/kibbr-server"]
exclude = ["fuzz", "lab-rs"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Pratyaydeep Ghanta <pratyaydeepghanta@gmail.com>"]
repository = "https://github.com/pratyaydeep/kibbr"
homepage = "https://github.com/pratyaydeep/kibbr"
rust-version = "1.96.1"
keywords = ["logs", "logging", "database", "columnar", "observability"]

# One version of each dependency for the whole workspace, and one place that says why it
# is here; a crate takes what it calls with `workspace = true`.
[workspace.dependencies]
# The four crates by path here, and by this version once published: `cargo publish` wants both.
kibbr-core = { path = "crates/kibbr-core", version = "0.1.1" }
kibbr-storage = { path = "crates/kibbr-storage", version = "0.1.1" }
kibbr-engine = { path = "crates/kibbr-engine", version = "0.1.1" }
kibbr-server = { path = "crates/kibbr-server", version = "0.1.1" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
# CRC-32C for every frame, chunk and log record, on the CPU's CRC instruction where there is one.
crc32c = "0.6.8"
# Default features, so the inflater is pure-Rust `miniz_oxide`: no C where hostile input is decoded.
flate2 = "1.1"
# The global allocator - why is at `#[global_allocator]` in src/main.rs.
mimalloc = "0.1.52"
# `statvfs` before a compaction writes, and a child's CPU time for `kibbr bench`: std has neither.
libc = "0.2"
# `Frame` and `SizeHint`, for the body the server wraps a request's in to know it was read whole.
http-body = "1"
# A scope on one small pool the disk store owns, for a query's scan threads - never the global pool.
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
# The settings file, `--config` (src/config.rs): the parser and serde only, nothing writes TOML.
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }
# The process's own log, written by one subscriber (src/logs.rs); no attribute macro, so no syn.
tracing = { version = "0.1", default-features = false, features = ["std"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-util = "0.7.19"
# For the bulk door's zstd inputs, `bench-storage` and compressed chunks; C, as high levels need.
zstd = { version = "0.13", default-features = false }

[package]
name = "kibbr"
description = "A database for structured JSON logs: each line's shape stored once in a trie, its values as typed columns, queryable in milliseconds."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://github.com/pratyaydeep/kibbr#readme"
rust-version.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["database-implementations", "command-line-utilities"]
exclude = ["/testdata/", "/bench/", "/deploy/", "/docs/", "/scripts/", "/fuzz/", "/.github/", "/lab/", "/lab-rs/"]

[dependencies]
kibbr-core.workspace = true
kibbr-storage.workspace = true
kibbr-engine.workspace = true
kibbr-server.workspace = true
chrono.workspace = true
clap.workspace = true
crc32c.workspace = true
flate2.workspace = true
mimalloc.workspace = true
libc.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tokio-util.workspace = true
zstd.workspace = true

[dev-dependencies]
# The storage crate's samples and failure hooks, for the tests here that hold a server to them.
kibbr-storage = { workspace = true, features = ["test-support"] }
# The `/ingest` tests build their own gzip bodies, the bomb included, not the machine's `gzip(1)`.
flate2.workspace = true
