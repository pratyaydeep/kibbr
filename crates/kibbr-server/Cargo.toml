[package]
name = "kibbr-server"
description = "The HTTP server of kibbr (https://github.com/pratyaydeep/kibbr), with the loads and compactions it runs; internal, no API stability promised."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kibbr-server"
rust-version.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["database-implementations"]

[dependencies]
kibbr-core.workspace = true
kibbr-storage.workspace = true
kibbr-engine.workspace = true
axum.workspace = true
chrono.workspace = true
flate2.workspace = true
http-body.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
zstd.workspace = true

[dev-dependencies]
# The storage crate's samples and failure hooks, for the tests here that use them.
kibbr-storage = { workspace = true, features = ["test-support"] }
