[package]
name = "kibbr-engine"
description = "The query planner, executor and TrieQL of kibbr (https://github.com/pratyaydeep/kibbr); internal, no API stability promised."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kibbr-engine"
rust-version.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["database-implementations"]

[dependencies]
kibbr-core.workspace = true
kibbr-storage.workspace = true
chrono.workspace = true
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
zstd.workspace = true

[dev-dependencies]
kibbr-storage = { workspace = true, features = ["test-support"] }

[features]
# What a test of a crate above this one reaches into a database with: see `Database`'s
# test-only methods. A `#[cfg(test)]` item is not there for another crate's tests.
test-support = ["kibbr-storage/test-support"]
