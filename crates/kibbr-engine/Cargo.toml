[package]
name = "kibbr-engine"
description = "The whole database of kibbr (https://github.com/pratyaydeep/kibbr) behind one handle: the parser, the trie, the day files, the write-ahead log and the query engine; no API stability promised."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kibbr-engine"
rust-version.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["database-implementations"]

[dependencies]
chrono.workspace = true
crc32c.workspace = true
flate2.workspace = true
libc.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
zstd.workspace = true

[features]
# What a test of a crate above this one builds its rows and files from, and reaches into a
# database with: a `#[cfg(test)]` item is not there for another crate's tests.
test-support = []
# The fuzz targets' harnesses over the log, the data files and the two record logs, for
# fuzz/ and tests/fuzz_regressions.rs; off by default, so a build carries none of them.
fuzzing = []
