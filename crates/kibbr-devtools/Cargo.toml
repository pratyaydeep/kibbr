[package]
name = "kibbr-devtools"
description = "What measures kibbr and is not part of it: the `kibbr-bench` binary. Never published."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# Every target with its path written out: the image is built with this manifest and none
# of the files beside it, and Cargo takes a member whose targets it need not look for.
autobins = false
autotests = false

[[bin]]
name = "kibbr-bench"
path = "src/main.rs"

[[test]]
name = "speed"
path = "tests/speed.rs"

[dependencies]
# The library of the `kibbr` package: the engine. The `kibbr` binary cannot be depended on,
# and the bench runs it as a child.
kibbr = { path = "../.." }
chrono.workspace = true
clap.workspace = true
crc32c.workspace = true
libc.workspace = true
mimalloc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
